# VERSÃO DE TESTE (grátis). Para a operação real, use os planos pagos.
databases:
  - name: estacionamento-db
    plan: free
    region: virginia
    databaseName: estacionamento
    user: estacionamento

services:
  - type: web
    name: estacionamento
    runtime: python
    plan: free
    region: virginia
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: estacionamento-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
